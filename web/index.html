<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#180b23">
    <meta name="description" content="Знакобум — собери свою коллекцию редких автомобильных номеров.">
    <title>Знакобум — коллекция номеров</title>
    <link rel="stylesheet" href="/app.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="topbar-title">
          <span class="eyebrow">ТВОЯ КОЛЛЕКЦИЯ</span>
          <h1 id="screen-title">Знакобум</h1>
        </div>
        <div class="wallet" aria-label="Игровой баланс">
          <span>₽</span>
          <strong id="balance">—</strong>
        </div>
        <div class="pumpkin-wallet" id="pumpkin-wallet" aria-label="Тыквы события" hidden>🎃 <strong id="pumpkins">0</strong></div>
      </header>

      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <section id="screen" aria-live="polite">
        <div class="loading"><span class="spinner"></span><span>Загружаем прогресс…</span></div>
      </section>

      <nav class="bottom-nav" aria-label="Основная навигация">
        <button class="nav-button active" data-screen="home"><span>🚘</span>Игра</button>
        <button class="nav-button" data-screen="collection"><span>🎫</span>Коллекция</button>
        <button class="nav-button" data-screen="upgrades"><span>⬆️</span>Улучшения</button>
        <button class="nav-button" data-screen="menu"><span>☰</span>Ещё</button>
      </nav>
      <footer class="footer-note">ЗНАКОБУМ · Игровые рубли не имеют денежной стоимости</footer>
    </main>
  </body>
</html>
